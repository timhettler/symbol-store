name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Node version comes from .nvmrc (currently 23.6.0), which the package
      # requires for native TypeScript type-stripping in the test suite.
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # Activate the Yarn version pinned in package.json (packageManager: yarn@4.6.0).
      - name: Enable Corepack
        run: corepack enable

      # enableGlobalCache is false in .yarnrc.yml, so the cache lives in .yarn/cache.
      - name: Cache Yarn
        uses: actions/cache@v6
        with:
          path: .yarn/cache
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            yarn-${{ runner.os }}-

      # --immutable fails if yarn.lock is out of date, which also validates
      # dependency-bump PRs.
      - name: Install
        run: yarn install --immutable

      # Builds every workspace (the published package compiles to dist/, and the
      # demo app runs next build). turbo caches, so the package build isn't
      # repeated by the test step below.
      - name: Build
        run: yarn build

      # turbo test: type-check (tsc --noEmit), unit tests (mocha), and the CLI
      # output test for the package, plus sprite generation for the demo app.
      - name: Test
        run: yarn test

  # Prove the published `engines` range (>=18.20 <19 || >=20.10) actually works:
  # compile the CLI on each supported Node and run the compiled bin — the exact
  # artifact a consumer runs. The full mocha suite can't run here (it needs Node
  # >=23.6 for native TS type-stripping), so it stays in build-test above; this
  # job is the compatibility smoke test the engines claim depends on.
  compat:
    name: CLI on Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The lower boundary of each engines range, plus a modern LTS. The dev
        # version (.nvmrc, currently 23.6) is already covered by build-test.
        node: ["18.20.0", "20.10.0", "22"]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      - name: Enable Corepack
        run: corepack enable

      - name: Cache Yarn
        uses: actions/cache@v6
        with:
          path: .yarn/cache
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            yarn-${{ runner.os }}-

      - name: Install
        run: yarn install --immutable

      # Compiles the CLI on this Node (tsc also type-checks), then runs the
      # compiled bin. Fails if the emitted JS uses anything the target Node
      # can't run — e.g. the JSON import attribute that sets the 18.20 floor.
      - name: Build the package
        run: yarn workspace @timhettler/symbol-store build

      - name: Run the compiled CLI
        run: yarn workspace @timhettler/symbol-store run test:output
